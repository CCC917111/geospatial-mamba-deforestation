[project]
name = "mamba-forest"
version = "0.1.0"
description = "Efficient multi-modal CNN-Mamba segmentation for forest typology on ForTy v1"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "tensorflow>=2.15",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
